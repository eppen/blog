<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="MES 2026 年 11 月工作总结封面">
<title>MES 2026 年 11 月工作总结</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a1220"/>
    <stop offset="1" stop-color="#101f34"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#38bdf8" stop-opacity="0.16"/>
    <stop offset="0.65" stop-color="#38bdf8" stop-opacity="0.05"/>
    <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
