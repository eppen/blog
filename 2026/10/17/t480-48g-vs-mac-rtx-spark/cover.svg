<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="T480 和 MacBook RTX Spark 48GB 对比封面">
<title>T480 和 MacBook RTX Spark 48GB 对比封面</title>
<defs>
