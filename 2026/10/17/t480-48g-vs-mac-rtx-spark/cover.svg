    <stop offset="0" stop-color="#0a1220"/>
    <stop offset="1" stop-color="#101f34"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#60a5fa" stop-opacity="0.24"/>
    <stop offset="0.65" stop-color="#60a5fa" stop-opacity="0.07"/>
    <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
  </radialGradient>
