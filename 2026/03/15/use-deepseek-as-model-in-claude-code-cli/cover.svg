<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="在 Claude Code CLI 中使用 DeepSeek 封面">
<title>在 Claude Code CLI 中使用 DeepSeek 封面</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a1220"/>
    <stop offset="1" stop-color="#101f34"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0.24"/>
    <stop offset="0.65" stop-color="#22d3ee" stop-opacity="0.07"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0a1220" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#0a1220" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
  </pattern>
</defs>
<rect width="1280" height="720" fill="url(#bg)"/>
<rect width="1280" height="720" fill="url(#grid)"/>
<circle cx="1000" cy="330" r="430" fill="url(#glow)"/>
<rect x="0" y="0" width="700" height="720" fill="url(#fade)"/>
<g opacity="0.9">
  
  <rect x="744" y="236" width="196" height="148" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2"/>
  <text x="842" y="286" text-anchor="middle" font-family="ui-monospace,Consolas,'Courier New',monospace" font-size="17" fill="#e2e8f0">Claude Code</text>
  <text x="842" y="314" text-anchor="middle" font-family="ui-monospace,Consolas,'Courier New',monospace" font-size="17" fill="#e2e8f0">CLI</text>
  <rect x="842" y="332" width="34" height="24" rx="4" fill="none" stroke="#22d3ee" stroke-width="2"/>
  <path d="M850 344 l6 6 l12 -14" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
  <rect x="1044" y="236" width="196" height="148" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2"/>
  <text x="1142" y="286" text-anchor="middle" font-family="ui-monospace,Consolas,'Courier New',monospace" font-size="17" fill="#e2e8f0">DeepSeek</text>
  <text x="1142" y="314" text-anchor="middle" font-family="ui-monospace,Consolas,'Courier New',monospace" font-size="17" fill="#e2e8f0">API</text>
  <circle cx="1142" cy="348" r="16" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
  <path d="M1130 348 h24 M1142 336 v24" stroke="#22d3ee" stroke-width="2.5"/>
  <path d="M944 310 H1036" stroke="#22d3ee" stroke-width="3" stroke-dasharray="8 6"/>
  <path d="M1022 300 L1036 310 L1022 320" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linejoin="round"/>
  <text x="990" y="286" text-anchor="middle" font-family="ui-monospace,Consolas,'Courier New',monospace" font-size="13" fill="#94a3b8">BASE_URL</text>

</g>
<g>
  <rect x="96" y="112" width="82" height="38" rx="19" fill="none" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="137" y="138" text-anchor="middle" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" fill="#22d3ee" letter-spacing="3">技术</text>
  <rect x="96" y="272" width="6" height="40" rx="3" fill="#22d3ee"/>
  <text x="96" y="326" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="40" font-weight="700" fill="#f8fafc" letter-spacing="1">在 Claude Code 中</text>
  <text x="96" y="380" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="40" font-weight="700" fill="#f8fafc" letter-spacing="1">使用 DeepSeek 模型</text>
  <text x="96" y="440" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="25" fill="#94a3b8" letter-spacing="1">ANTHROPIC_BASE_URL</text>
  <line x1="96" y1="612" x2="196" y2="612" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
